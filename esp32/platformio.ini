; Compilar: pio run          (dentro da pasta esp32/)
; Gravar:   pio run -t upload
; Serial:   pio device monitor
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Mais espaco para o programa (3 MB). Abre mao da atualizacao OTA, que nao usamos.
board_build.partitions = huge_app.csv
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  miguelbalboa/MFRC522@^1.4.11
  chris--a/Keypad@^3.1.1
