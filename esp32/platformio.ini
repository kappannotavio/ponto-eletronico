; Compilar: pio run          (dentro da pasta esp32/)
; Gravar:   pio run -t upload
; Serial:   pio device monitor
;
; O codigo fica em src/ (pasta padrao do PlatformIO).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Programa com ate 3 MB e ~900 KB de memoria interna (LittleFS) para a fila
; offline e a lista de funcionarios. Abre mao da atualizacao OTA, que nao usamos.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  miguelbalboa/MFRC522@^1.4.11
  chris--a/Keypad@^3.1.1
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  adafruit/RTClib@^2.1.4
